# Quick Go test matrix for submodules (no full stack / E2E).
# Canonical vertical E2E: scripts/stage-6-1-canonical-e2e.ps1 + docs/stages/stage-6-1-canonical-e2e.md
name: go-smoke

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: strategy-dsl
        run: go test ./...
        working-directory: modules/strategy-dsl
      - name: control-plane
        run: go test ./...
        working-directory: services/control-plane
      - name: backtest-engine
        run: go test ./...
        working-directory: services/backtest-engine
      - name: results-api
        run: go test ./...
        working-directory: services/results-api
